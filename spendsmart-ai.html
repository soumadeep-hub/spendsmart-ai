</style></head><body><div id="gate"></div><div class="app"><aside><div class="logo">SpendSmart AI</div><nav id="nav"></nav></aside><main><header><h1 id="ttl"></h1><div style="display:flex;gap:4px"><button class="gh" onclick="bankWin(S.bank?4:1)">🏦 Bank</button><button class="gh" id="th">Theme</button><button class="gh" onclick="logout()">Log out</button></div></header><div id="main"></div><p class="mut" style="margin:28px 0 0;font-size:12px">Bank link and sample data are simulated. Everything stays in this browser. Not financial advice.</p></main></div>
<script>
const CATS={Food:"swiggy zomato restaurant cafe lunch dinner pizza grocery bigbasket blinkit milk biryani canteen chai breakfast",Shopping:"amazon flipkart myntra clothes shoes mall shopping electronics gadget",Transportation:"uber ola metro bus petrol fuel auto cab train taxi parking fastag",Education:"tuition course udemy books college fees exam stationery coaching library",Healthcare:"pharmacy doctor hospital medicine clinic apollo dental lab checkup",Entertainment:"netflix movie cinema spotify concert game hotstar prime gaming pvr",Bills:"electricity water gas broadband wifi recharge mobile bill insurance airtel jio",Rent:"rent landlord pg hostel lease maintenance flat",Travel:"flight hotel irctc makemytrip trip airbnb booking holiday resort visa"};
const CN=Object.keys(CATS),PAGES=["Dashboard","Transactions","Budgets","Predictions","Planner"];
let KEY="ss",U=null,S={tx:[],budgets:{},subs:[],goals:[],allow:0,id:1},page="Dashboard",edit=null,flt={q:"",c:"",t:""},charts=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const inr=n=>"₹"+Math.round(n||0).toLocaleString("en-IN"),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ym=d=>d.slice(0,7),now=new Date(),TD=now.toISOString().slice(0,10),CM=ym(TD),sum=a=>a.reduce((x,y)=>x+y,0);
const exp=()=>S.tx.filter(t=>t.type=="expense"),mth=(a,m)=>a.filter(t=>ym(t.date)==m);
/* ---- ML (runs in your browser on your own data) ---- */
function categorize(text){const w=text.toLowerCase().match(/[a-z]+/g)||[],sc={};
 for(const c of CN){let s=0;for(const k of CATS[c].split(" "))for(const x of w)if(x==k)s+=2;else if(x.length>3&&(k.includes(x)||x.includes(k)))s+=1;sc[c]=s}
 for(const t of exp()){if(t.manual)for(const x of w)if((t.description.toLowerCase().match(/[a-z]+/g)||[]).includes(x))sc[t.category]+=1.5}
 const b=CN.sort((a,c)=>sc[c]-sc[a])[0],tot=sum(Object.values(sc));return tot>0?{c:b,p:sc[b]/tot}:null}
function reg(y){const n=y.length,x=[...y.keys()],mx=(n-1)/2,my=sum(y)/n;let a=0,d=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);d+=(v-mx)**2});const m=d?a/d:0,c=my-m*mx;return{f:i=>m*i+c}}
function forecast(){const g={};for(const t of exp())if(ym(t.date)<CM)(g[ym(t.date)]??=[]).push(t);const ms=Object.keys(g).sort();
 if(ms.length<3)return{ok:false,why:`Needs at least 3 completed months of expenses; you have ${ms.length}.`};
 const tot=ms.map(m=>sum(g[m].map(t=>t.amount))),r=reg(tot),nxt=Math.max(0,r.f(ms.length)),err=sum(tot.map((v,i)=>Math.abs(v-r.f(i))/v))/tot.length*100;
 const cm=sum(mth(exp(),CM).map(t=>t.amount)),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),w=now.getDate()/dim,eom=cm>0?w*(cm/now.getDate()*dim)+(1-w)*nxt:nxt,cat={};
 for(const c of CN){const s=ms.map(m=>sum(g[m].filter(t=>t.category==c).map(t=>t.amount)));if(s.filter(v=>v>0).length>=3)cat[c]=Math.max(0,reg(s).f(s.length))}
 return{ok:true,nxt,eom,cm,err,cat,hist:ms.map((m,i)=>({m,a:tot[i],p:r.f(i)}))}}
function anomalies(){const e=exp();if(e.length<15)return{ok:false,why:"Needs at least 15 expenses to judge what is unusual.",u:[],sp:[]};const u=[];
 for(const c of CN){const a=e.filter(t=>t.category==c);if(a.length<5)continue;const m=sum(a.map(t=>t.amount))/a.length,sd=Math.sqrt(sum(a.map(t=>(t.amount-m)**2))/a.length);if(sd)for(const t of a){const z=(t.amount-m)/sd;if(z>2.5)u.push({...t,z})}}
 const pm=new Date(now.getFullYear(),now.getMonth()-1,1).toISOString().slice(0,7),sp=[];
 for(const c of CN){const cu=sum(mth(e,CM).filter(t=>t.category==c).map(t=>t.amount)),pv=sum(mth(e,pm).filter(t=>t.category==c).map(t=>t.amount));if(pv>=500&&cu>pv*1.4)sp.push({c,cu,pv,pct:Math.round((cu/pv-1)*100)})}return{ok:true,u,sp}}
function stats(){const m=mth(S.tx,CM),inc=sum(m.filter(t=>t.type=="income").map(t=>t.amount)),ex=sum(m.filter(t=>t.type=="expense").map(t=>t.amount)),by={};
 m.filter(t=>t.type=="expense").forEach(t=>by[t.category]=(by[t.category]||0)+t.amount);
 return{inc,ex,by,bal:sum(S.tx.filter(t=>t.type=="income").map(t=>t.amount))-sum(exp().map(t=>t.amount))}}
function spentFor(k,st){return k=="Overall"?st.ex:st.by[k]||0}
function health(st){if(!st.inc&&!st.ex)return null;const rate=st.inc?(st.inc-st.ex)/st.inc:-1,sv=Math.max(0,Math.min(40,rate/.3*40)),bk=Object.keys(S.budgets),over=bk.filter(k=>spentFor(k,st)>S.budgets[k]).length,bd=bk.length?30*(1-over/bk.length):15;
 const wants=["Entertainment","Shopping","Travel"].reduce((a,c)=>a+(st.by[c]||0),0),ds=Math.max(0,15*(1-(st.ex?wants/st.ex:0)/.4)),an=anomalies(),cs=Math.max(0,15-5*an.u.filter(t=>ym(t.date)==CM).length);
 return{score:Math.round(sv+bd+ds+cs),parts:{Savings:Math.round(sv),Budgets:Math.round(bd),Discipline:Math.round(ds),Consistency:Math.round(cs)},nb:!bk.length}}
function coach(st){const o=[];if(!S.tx.length)return o;if(st.inc&&(st.inc-st.ex)/st.inc<.2)o.push(`Your savings rate this month is ${Math.round((st.inc-st.ex)/st.inc*100)}%. Aim for 20% or more of income.`);
 const ks=Object.keys(st.by);if(st.ex&&ks.length){const t=ks.sort((a,b)=>st.by[b]-st.by[a])[0];o.push(`${t} is your biggest category: ${Math.round(st.by[t]/st.ex*100)}% of spending (${inr(st.by[t])}).`);
  const w=["Entertainment","Shopping","Travel"].reduce((a,c)=>a+(st.by[c]||0),0);if(w/st.ex>.3)o.push(`Shopping, entertainment and travel are ${Math.round(w/st.ex*100)}% of expenses. Trimming 20% would free about ${inr(w*.2)} a month.`)}
 for(const k in S.budgets){const s=spentFor(k,st),l=S.budgets[k];if(s>l)o.push(`You are over your ${k} budget by ${inr(s-l)}.`);else if(s>.8*l)o.push(`Your ${k} budget is ${Math.round(s/l*100)}% used.`)}
 const sb=sum(S.subs.map(s=>s.amount));if(sb&&st.inc&&sb/st.inc>.05)o.push(`Subscriptions cost ${inr(sb)} a month (${Math.round(sb/st.inc*100)}% of income). Cancel any you rarely use.`);
 if(!Object.keys(S.budgets).length)o.push("You have no budgets yet. Set category limits so overspending can be flagged.");return o}
/* ---- UI ---- */
const stat=(l,v,c="")=>`<div class="card"><div class="mut">${l}</div><div class="big ${c}">${inr(v)}</div></div>`;
const note=t=>`<div class="note">${t}</div>`;
function bars(st){const ks=Object.keys(S.budgets);return ks.length?ks.map(k=>{const s=spentFor(k,st),l=S.budgets[k],p=s/l*100;return`<div class="row" style="justify-content:space-between"><b>${esc(k)}</b><span class="mut">${inr(s)} of ${inr(l)}</span></div><div class="bar"><i style="width:${Math.min(p,100)}%;${p>100?"background:var(--bad)":p>80?"background:var(--warn)":""}"></i></div>${p>100?`<div class="bad mut" style="margin:-6px 0 8px">Over budget by ${inr(s-l)}</div>`:""}`}).join(""):note("No budgets yet. Open Budgets to set one.")}
function mk(id,cfg){const c=$(id);if(c)charts.push(new Chart(c,cfg))}
const PAL=["#7c3aed","#2563eb","#06b6d4","#10b981","#f59e0b","#ef4444","#ec4899","#8b5cf6","#64748b"],opt={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:getComputedStyle(document.documentElement).getPropertyValue("--mut")}}}};
const views={
Dashboard(){const st=stats(),h=health(st),f=forecast(),a=anomalies(),ci=coach(st),mo={};S.tx.forEach(t=>{const k=ym(t.date);(mo[k]??={i:0,e:0})[t.type=="income"?"i":"e"]+=t.amount});const ks=Object.keys(mo).sort().slice(-8);
 const empty=!S.tx.length?`<div class="card" style="margin-bottom:14px"><b>Your dashboard is empty.</b><div class="mut">Add a transaction, or load realistic sample data to explore the AI features.</div><div class="row" style="margin-top:10px"><button class="btn" onclick="go('Transactions')">Add transaction</button><button class="gh" onclick="demo()">Load demo data</button></div></div>`:"";
 setTimeout(()=>{mk("c1",{type:"bar",data:{labels:ks,datasets:[{label:"Income",data:ks.map(k=>mo[k].i),backgroundColor:"#2563eb",borderRadius:6},{label:"Spending",data:ks.map(k=>mo[k].e),backgroundColor:"#7c3aed",borderRadius:6}]},options:opt});
  mk("c2",{type:"doughnut",data:{labels:Object.keys(st.by),datasets:[{data:Object.values(st.by),backgroundColor:PAL,borderWidth:0}]},options:opt})},0);
 return empty+`<div class="grid g4">${stat("Total balance",st.bal)}${stat("Income this month",st.inc,"ok")}${stat("Spent this month",st.ex,"bad")}${stat("Saved this month",st.inc-st.ex)}</div>
 <div class="grid g3" style="margin-top:14px"><div class="card s2"><h3>Monthly income vs spending</h3><div class="cv"><canvas id="c1"></canvas></div></div><div class="card"><h3>This month by category</h3>${Object.keys(st.by).length?'<div class="cv"><canvas id="c2"></canvas></div>':note("No expenses this month yet.")}</div></div>
 <div class="grid g3" style="margin-top:14px"><div class="card"><h3>Financial health score</h3>${h?`<div class="score">${h.score}<span class="mut" style="font-size:18px">/100</span></div>${Object.entries(h.parts).map(([k,v])=>`<div class="row" style="justify-content:space-between"><span>${k}</span><b>${v}</b></div>`).join("")}${h.nb?'<div class="mut">Set budgets for a more accurate score.</div>':""}`:note("Add this month’s income and expenses to get a score.")}</div>
 <div class="card"><h3>AI spending forecast</h3>${f.ok?`<div class="mut">Projected spend this month</div><div class="big">${inr(f.eom)}</div><div class="mut">Next month: <b>${inr(f.nxt)}</b> · avg model error ${f.err.toFixed(1)}%</div>`:note("Not enough data for a forecast. "+f.why)}</div>
 <div class="card"><h3>Budget progress</h3>${bars(st)}</div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Unusual spending alerts</h3>${!a.ok?note(a.why):a.u.map(t=>`<p>⚠️ <b>${inr(t.amount)}</b> on “${esc(t.description)}” (${t.date}) is ${t.z.toFixed(1)} std devs above your usual ${t.category} spend.</p>`).join("")+a.sp.map(s=>`<p>📈 ${s.c} is up ${s.pct}% vs last month (${inr(s.pv)} → ${inr(s.cu)}).</p>`).join("")||'<span class="mut">Nothing unusual detected.</span>'}</div>
 <div class="card"><h3>AI savings coach</h3>${ci.length?"<ul>"+ci.map(x=>`<li style="margin-bottom:6px">${esc(x)}</li>`).join("")+"</ul>":note("Add transactions to receive personalised advice.")}</div></div>
 <div class="card" style="margin-top:14px"><h3>Recent transactions</h3><table>${[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(t=>`<tr><td>${esc(t.description)} <span class="tag">${t.category||"Income"}</span></td><td style="text-align:right" class="${t.type=="income"?"ok":""}"><b>${t.type=="income"?"+":"−"}${inr(t.amount)}</b></td></tr>`).join("")||"<tr><td class='mut'>No transactions yet.</td></tr>"}</table></div>`},
Transactions(){const e=S.tx.find(t=>t.id==edit)||{type:"expense",description:"",amount:"",date:TD,category:""},rows=[...S.tx].filter(t=>(!flt.q||t.description.toLowerCase().includes(flt.q.toLowerCase()))&&(!flt.c||t.category==flt.c)&&(!flt.t||t.type==flt.t)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 return`<form class="card" onsubmit="addTx(event)"><div class="row"><select id="f_t"><option value="expense">Expense</option><option value="income"${e.type=="income"?" selected":""}>Income</option></select><input id="f_d" placeholder="Description (e.g. Swiggy dinner)" required maxlength="200" value="${esc(e.description)}" onblur="hint()" style="flex:2 1 200px"><input id="f_a" type="number" step="0.01" min="0.01" placeholder="Amount ₹" required value="${e.amount}"><input id="f_dt" type="date" required value="${e.date}"><select id="f_c"><option value="">Auto-categorise</option>${CN.map(c=>`<option${e.category==c?" selected":""}>${c}</option>`).join("")}</select></div>
 <div class="row" style="margin-top:10px"><button class="btn">${edit?"Save changes":"Add transaction"}</button>${edit?'<button type="button" class="gh" onclick="edit=null;render()">Cancel</button>':""}<span id="hint" class="mut" style="flex:1 1 200px"></span></div></form>
 <div class="card" style="margin-top:14px"><div class="row" style="margin-bottom:10px"><input placeholder="Search…" value="${esc(flt.q)}" oninput="flt.q=this.value;list()"><select onchange="flt.c=this.value;list()"><option value="">All categories</option>${CN.map(c=>`<option${flt.c==c?" selected":""}>${c}</option>`).join("")}</select><select onchange="flt.t=this.value;list()"><option value="">All types</option><option value="income"${flt.t=="income"?" selected":""}>Income</option><option value="expense"${flt.t=="expense"?" selected":""}>Expense</option></select></div><div style="overflow-x:auto" id="list">${tbl(rows)}</div></div>`},
Budgets(){const st=stats();return`<form class="card" onsubmit="setB(event)"><div class="row"><select id="b_c"><option value="Overall">Overall monthly budget</option>${CN.map(c=>`<option>${c}</option>`).join("")}</select><input id="b_l" type="number" min="1" required placeholder="Limit ₹"><button class="btn">Save budget</button></div></form><div class="card" style="margin-top:14px">${bars(st)}${Object.keys(S.budgets).map(k=>`<button class="gh" onclick="delete S.budgets['${k}'];save();render()">Remove ${k}</button>`).join("")}</div>`},
Predictions(){const f=forecast();if(!f.ok)return note("Not enough data for a forecast. "+f.why+" Estimated numbers are never shown without enough history.");
 setTimeout(()=>mk("c3",{type:"line",data:{labels:[...f.hist.map(h=>h.m),"Next"],datasets:[{label:"Actual",data:f.hist.map(h=>h.a),borderColor:"#7c3aed",borderWidth:3,tension:.25},{label:"Predicted",data:[...f.hist.map(h=>h.p),f.nxt],borderColor:"#2563eb",borderDash:[6,4],borderWidth:3,tension:.25}]},options:opt}),0);
 return`<div class="grid g3">${stat("Spent so far this month",f.cm)}${stat("Projected end of month",f.eom)}${stat("Predicted next month",f.nxt)}</div><div class="card" style="margin-top:14px"><h3>Actual vs predicted (linear regression, avg error ${f.err.toFixed(1)}%)</h3><div class="cv"><canvas id="c3"></canvas></div></div><div class="card" style="margin-top:14px"><h3>Predicted next month by category</h3>${Object.keys(f.cat).length?Object.entries(f.cat).map(([k,v])=>`<div class="row" style="justify-content:space-between"><span>${k}</span><b>${inr(v)}</b></div>`).join(""):note("Each category needs 3 months of spending.")}</div>`},
Planner(){const sd=S.allow?(()=>{const sp=sum(mth(exp(),CM).map(t=>t.amount)),left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;return`Spent ${inr(sp)} of ${inr(S.allow)}. Safe to spend <b>${inr(Math.max(S.allow-sp,0)/left)}/day</b> for the next ${left} days.`})():"";
 return`<div class="grid g2"><div class="card"><h3>Subscriptions</h3><form class="row" onsubmit="addSub(event)"><input id="s_n" placeholder="Name" required><input id="s_a" type="number" min="1" placeholder="₹" required><input id="s_d" type="date" value="${TD}" required><button class="btn">Add</button></form>${S.subs.map((s,i)=>{const d=Math.round((new Date(s.due)-new Date(TD))/864e5);return`<div class="row" style="justify-content:space-between;margin-top:8px"><span>${esc(s.name)}</span><span>${inr(s.amount)} · ${d<=7?`<b style="color:var(--warn)">due in ${d} days</b>`:s.due} <button class="gh" onclick="S.subs.splice(${i},1);save();render()">Remove</button></span></div>`}).join("")}</div>
 <div class="card"><h3>Savings goals</h3><form class="row" onsubmit="addGoal(event)"><input id="g_n" placeholder="Goal" required><input id="g_t" type="number" min="1" placeholder="Target ₹" required><input id="g_s" type="number" min="0" placeholder="Saved ₹"><button class="btn">Add</button></form>${S.goals.map((g,i)=>`<div style="margin-top:8px"><div class="row" style="justify-content:space-between"><span>${esc(g.name)}</span><span>${inr(g.saved)} / ${inr(g.target)} <button class="gh" onclick="S.goals.splice(${i},1);save();render()">Remove</button></span></div><div class="bar"><i style="width:${Math.min(g.saved/g.target*100,100)}%;background:var(--ok)"></i></div></div>`).join("")}</div>
 <div class="card"><h3>What-if simulator</h3><div class="row"><label class="mut">Monthly ₹<input id="m_a" type="number" value="5000" min="0" oninput="sim()"></label><label class="mut">Years<input id="m_y" type="number" value="5" min="1" max="50" oninput="sim()"></label><label class="mut">Return %/yr<input id="m_r" type="number" value="6" min="0" max="30" step="any" oninput="sim()"></label></div><p id="simout"></p><p class="mut">The return rate is your assumption, not a prediction.</p></div>
 <div class="card"><h3>Student mode</h3><form class="row" onsubmit="S.allow=+$('al').value;save();render();event.preventDefault()"><input id="al" type="number" min="1" placeholder="Monthly allowance ₹" required value="${S.allow||""}"><button class="btn">Set</button></form><p>${sd}</p></div></div>`}};
function tbl(rows){return rows.length?`<table>${rows.map(t=>`<tr><td style="white-space:nowrap">${t.date}</td><td>${esc(t.description)}</td><td><span class="tag">${t.category||"Income"}${t.auto?" ✨":""}</span></td><td style="text-align:right" class="${t.type=="income"?"ok":""}"><b>${inr(t.amount)}</b></td><td style="text-align:right;white-space:nowrap"><button class="gh" onclick="edit=${t.id};render();scrollTo(0,0)">Edit</button><button class="gh bad" onclick="del(${t.id})">Delete</button></td></tr>`).join("")}</table>`:note("No transactions match.")}
function list(){const r=S.tx.filter(t=>(!flt.q||t.description.toLowerCase().includes(flt.q.toLowerCase()))&&(!flt.c||t.category==flt.c)&&(!flt.t||t.type==flt.t)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$("list").innerHTML=tbl(r)}
function hint(){const d=$("f_d").value.trim();if(!d||$("f_t").value!="expense")return;const r=categorize(d);$("hint").textContent=r?`AI suggests ${r.c} (${Math.round(r.p*100)}% confident)`:"Couldn’t classify this one. Please pick a category.";if(r&&!$("f_c").value)$("f_c").value=r.c}
function addTx(ev){ev.preventDefault();const ty=$("f_t").value,d=$("f_d").value.trim(),a=+$("f_a").value;let c=$("f_c").value,auto=false,man=!!c;if(!(a>0)||!d)return;
 if(ty=="expense"&&!c){const r=categorize(d);if(!r){$("hint").textContent="Couldn’t classify this one. Please pick a category.";return}c=r.c;auto=true}
 const o={type:ty,description:d,amount:a,date:$("f_dt").value,category:ty=="expense"?c:null,auto,manual:man&&ty=="expense"};
 if(edit){Object.assign(S.tx.find(t=>t.id==edit),o);edit=null}else S.tx.push({id:S.id++,...o});save();render()}
function del(i){if(confirm("Delete this transaction?")){S.tx=S.tx.filter(t=>t.id!=i);save();render()}}
function setB(ev){ev.preventDefault();S.budgets[$("b_c").value]=+$("b_l").value;save();render()}
function addSub(ev){ev.preventDefault();S.subs.push({name:$("s_n").value.trim(),amount:+$("s_a").value,due:$("s_d").value});save();render()}
function addGoal(ev){ev.preventDefault();S.goals.push({name:$("g_n").value.trim(),target:+$("g_t").value,saved:+$("g_s").value||0});save();render()}
function sim(){const m=+$("m_a").value,y=+$("m_y").value,r=+$("m_r").value/1200;if(!(y>0&&y<=50&&m>=0)){$("simout").textContent="Enter valid values.";return}let b=0;for(let i=0;i<Math.floor(y*12);i++)b=b*(1+r)+m;$("simout").innerHTML=`You invest ${inr(m*Math.floor(y*12))} and could have <b style="color:var(--p)">${inr(b)}</b>.`}
function demo(){let s=42;const R=()=>(s=s*1664525+1013904223>>>0)/4294967296,it=[["Rent - landlord","Rent",14000,14000],["Swiggy dinner","Food",250,700],["BigBasket groceries","Food",900,2200],["Uber ride","Transportation",120,450],["Amazon order","Shopping",600,3500],["Movie PVR","Entertainment",400,900],["Electricity bill","Bills",900,1800],["Pharmacy medicine","Healthcare",150,800],["Udemy course","Education",449,1200]];
 for(let mo=6;mo>=0;mo--){const b=new Date(now.getFullYear(),now.getMonth()-mo,1),pad=n=>String(n).padStart(2,"0"),dt=d=>`${b.getFullYear()}-${pad(b.getMonth()+1)}-${pad(d)}`;S.tx.push({id:S.id++,type:"income",description:"Salary",amount:55000,date:dt(2),category:null});
  for(const[n,c,lo,hi]of it){const k=lo==hi||c=="Bills"||c=="Education"?1:2+Math.floor(R()*4);for(let j=0;j<k;j++){const d=1+Math.floor(R()*27);if(dt(d)<=TD)S.tx.push({id:S.id++,type:"expense",description:n,amount:Math.round((lo+R()*(hi-lo))*(1+.03*(6-mo))),date:dt(d),category:c})}}}
 S.tx.push({id:S.id++,type:"expense",description:"Amazon electronics laptop bag",amount:18500,date:TD,category:"Shopping"});Object.assign(S.budgets,{Food:9000,Shopping:4000,Entertainment:2500});
 S.subs.push({name:"Netflix",amount:649,due:new Date(Date.now()+4*864e5).toISOString().slice(0,10)});S.goals.push({name:"Emergency fund",target:100000,saved:32000});save();render()}
function go(p){page=p;edit=null;render()}
function render(){charts.forEach(c=>c.destroy());charts=[];$("ttl").textContent=page;$("nav").innerHTML=PAGES.map(p=>`<button class="${p==page?"on":""}" onclick="go('${p}')">${p}</button>`).join("");$("main").innerHTML=views[page]();if(page=="Planner")sim()}
$("th").onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))=="dark";r.dataset.theme=d?"light":"dark";opt.plugins.legend.labels.color=getComputedStyle(r).getPropertyValue("--mut");render()};
/* ---- Login + bank link-up ---- */
const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function hash(pw,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:150000,hash:"SHA-256"},k,256))}
const users=()=>{try{return JSON.parse(localStorage.getItem("ss_users")||"{}")}catch(e){return{}}};
function gateUI(h){const g=$("gate");g.style.placeItems="center";g.scrollTop=0;g.style.display=h?"grid":"none";g.innerHTML=h||""}
function authView(m){gateUI(`<form class="card auth" onsubmit="authGo(event,'${m}')"><div class="logo">SpendSmart AI</div><h2>${m=="login"?"Welcome back":"Create your account"}</h2><p class="mut">Your data is saved only in this browser. Never enter bank passwords, UPI PINs or OTPs in this app.</p>${m=="register"?'<input id="a_n" placeholder="Full name" required maxlength="80">':""}<input id="a_e" type="email" placeholder="Email" required><input id="a_p" type="password" placeholder="Password (8+ characters)" minlength="8" required><div id="a_err" class="bad mut" role="alert"></div>${m=="login"?'<button type="button" class="gh" onclick="forgotView()" style="align-self:flex-start">Forgot password?</button>':""}<button class="btn">${m=="login"?"Log in":"Create account"}</button><button type="button" class="gh" onclick="landing()">← Back to home</button><button type="button" class="gh" onclick="authView('${m=="login"?"register":"login"}')">${m=="login"?"New here? Create an account":"Have an account? Log in"}</button></form>`)}
async function authGo(ev,m){ev.preventDefault();const e=$("a_e").value.trim().toLowerCase(),p=$("a_p").value,us=users(),er=t=>$("a_err").textContent=t;
 if(p.length<8)return er("Password must be at least 8 characters.");
 try{if(m=="register"){if(us[e])return er("That email is already registered. Log in instead.");const salt=hex(crypto.getRandomValues(new Uint8Array(16)));us[e]={name:$("a_n").value.trim(),salt,h:await hash(p,salt)};localStorage.setItem("ss_users",JSON.stringify(us))}
 else{const u=us[e];if(!u||u.h!==await hash(p,u.salt))return er("Invalid email or password.")}
 const u2=us[e];let code=null;if(!u2.rh)code=await mkCode(us,e);sessionStorage.setItem("ss_cur",e);code?recView(code,e,m=="register"?"Account created.":""):enter(e)}catch(x){er("Could not sign in. Please try again.")}}
const alpha="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let pe="",tries=0;
async function mkCode(us,e){const c=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>alpha[x%32]).join("").match(/.{4}/g).join("-"),salt=hex(crypto.getRandomValues(new Uint8Array(16)));us[e].rs=salt;us[e].rh=await hash(c,salt);localStorage.setItem("ss_users",JSON.stringify(us));return c}
function recView(c,e,m){pe=e;gateUI(`<div class="card auth"><div class="logo">Save your recovery code</div>${m?`<p class="ok"><b>${m}</b></p>`:""}<p class="mut">This code lets you reset your password if you forget it. It is shown only once, so write it down or keep it somewhere safe.</p><div class="note" style="font:700 20px ui-monospace,monospace;text-align:center;letter-spacing:1px">${c}</div><button type="button" class="gh" onclick="navigator.clipboard&&navigator.clipboard.writeText('${c}')">Copy code</button><button class="btn" onclick="enter(pe)">I have saved it. Continue</button></div>`)}
function forgotView(){gateUI(`<form class="card auth" onsubmit="forgotGo(event)"><div class="logo">Reset password</div><p class="mut">Enter your email, your recovery code and a new password.</p><input id="f_e" type="email" placeholder="Email" required><input id="f_c" placeholder="Recovery code (XXXX-XXXX-XXXX)" required maxlength="14" autocomplete="off"><input id="f_p" type="password" placeholder="New password (8+ characters)" minlength="8" required><div id="a_err" class="bad mut" role="alert"></div><button class="btn">Reset password</button><button type="button" class="gh" onclick="authView('login')">Back to log in</button><p class="mut">Lost your recovery code? This browser-only demo has no email service to verify you, so you would need to create a new account. The full version resets through an emailed link.</p></form>`)}
async function forgotGo(ev){ev.preventDefault();const er=t=>$("a_err").textContent=t;if(tries>=5)return er("Too many attempts. Reload the page to try again.");
 const e=$("f_e").value.trim().toLowerCase(),c=$("f_c").value.trim().toUpperCase(),p=$("f_p").value,us=users(),u=us[e];if(p.length<8)return er("Password must be at least 8 characters.");
 try{if(!u||!u.rh||u.rh!==await hash(c,u.rs)){tries++;return er("Email or recovery code is incorrect.")}
 u.salt=hex(crypto.getRandomValues(new Uint8Array(16)));u.h=await hash(p,u.salt);const nc=await mkCode(us,e);sessionStorage.setItem("ss_cur",e);recView(nc,e,"Password updated. Your old recovery code no longer works; use this new one.")}catch(x){er("Could not reset the password. Please try again.")}}
function enter(e){U=e;KEY="ss_d_"+e;const b={tx:[],budgets:{},subs:[],goals:[],allow:0,id:1};try{S=JSON.parse(localStorage.getItem(KEY)||"null")||b}catch(x){S=b}gateUI("");if(!S.bank&&!S.skip)bankWin(1);else render()}
function logout(){sessionStorage.removeItem("ss_cur");U=null;charts.forEach(c=>c.destroy());charts=[];landing()}
const BANKS=["State Bank of India","HDFC Bank","ICICI Bank","Axis Bank","Kotak Mahindra Bank","Punjab National Bank","Bank of Baroda","Canara Bank"];let pick="";
function bankWin(s){
 if(s==1)gateUI(`<div class="card auth" style="max-width:520px"><div class="logo">Link your bank</div><p class="mut">Step 1 of 3: choose your bank. This is a simulated demo, so no real bank is contacted.</p><div class="grid g2">${BANKS.map(b=>`<button class="gh bk" onclick="pick='${b}';bankWin(2)">${b}</button>`).join("")}</div><div><button class="gh" onclick="S.skip=true;save();gateUI('');render()">Skip for now</button></div></div>`);
 if(s==2)gateUI(`<div class="card auth" style="max-width:460px"><div class="logo">Approve access</div><p class="mut">Step 2 of 3: ${pick}</p><div class="note"><b>SpendSmart AI will get</b><ul style="margin:6px 0 0;padding-left:18px"><li>Account balance summary</li><li>Transactions from the last 6 months</li></ul><p style="margin:8px 0 0">Read-only access for 12 months. You can disconnect any time.</p></div><div class="note">SpendSmart never asks for your bank password, UPI PIN or OTP. In a real setup you approve this on your bank’s own page through an RBI-licensed Account Aggregator.</div><button class="btn" onclick="bankWin(3)">Approve (demo)</button><button class="gh" onclick="bankWin(1)">Back</button></div>`);
 if(s==3){gateUI(`<div class="card auth"><h2>Connecting to ${pick}…</h2><p class="mut">Step 3 of 3</p><div class="bar"><i id="pg" style="width:0;transition:width 1.6s"></i></div></div>`);setTimeout(()=>{const p=$("pg");if(p)p.style.width="100%"},50);
  setTimeout(()=>{S.bank={name:pick,acct:"•••• "+(1000+Math.floor(Math.random()*9000)),at:TD};if(!S.tx.length)demo();else save();gateUI(`<div class="card auth"><div class="big ok">✓</div><h2>${pick} linked (demo)</h2><p class="mut">${S.bank.acct} · read-only. Sample transactions were imported. No real bank data was shared.</p><button class="btn" onclick="gateUI('');go('Dashboard')">Open dashboard</button></div>`)},1800)}
 if(s==4)gateUI(`<div class="card auth"><div class="logo">Linked bank</div><p><b>${S.bank.name}</b> ${S.bank.acct}<br><span class="mut">Linked on ${S.bank.at} (demo, read-only)</span></p><button class="btn" onclick="S.bank=null;S.skip=false;save();bankWin(1)">Disconnect and link another</button><button class="gh" onclick="gateUI('')">Close</button></div>`)}

function landing(){const F=[["🏷️","Auto-categorise","Type “Swiggy dinner” and it files it under Food, learning from your corrections."],["📈","Spending forecast","A regression model projects this month and next, with its own error shown."],["🚨","Unusual spend alerts","Spots outliers and categories that jumped versus last month."],["💯","Health score","One 0 to 100 score from savings rate, budgets and discipline."],["🎯","Budgets and goals","Category limits, subscriptions due soon, savings goals and a daily safe-to-spend."],["🔒","Private by design","No server, no tracking. Your data lives only in this browser."]];
gateUI(`<div class="land"><div class="lnav"><div class="lg">SpendSmart AI</div><button class="lb" onclick="authView('login')">Log in</button></div><section class="hero"><span class="pill">Free · Private · Works offline-first</span><h1>Know where every rupee goes.</h1><p>Track spending, get AI-powered forecasts and a simple plan to save more, without handing your data to anyone.</p><div class="ctas"><button class="btn" onclick="guest()">Try the live demo</button><button class="lb" onclick="authView('register')">Create free account</button></div></section><div class="feat">${F.map(f=>`<div class="fc"><div class="fi">${f[0]}</div><b>${f[1]}</b><span>${f[2]}</span></div>`).join("")}</div><div class="steps"><div><b>1</b>Open the demo with sample data</div><div><b>2</b>Add your own income and expenses</div><div><b>3</b>Follow the coach’s tips to save</div></div><p class="foot">Bank linking is a simulation and no real bank is contacted. Accounts are stored only in your browser. Not financial advice.</p></div>`);$("gate").style.placeItems="start center"}
function guest(){U="guest";KEY="ss_d_guest";try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(x){S=null}S=S||{tx:[],budgets:{},subs:[],goals:[],allow:0,id:1};S.skip=true;gateUI("");if(!S.tx.length)demo();else render()}
function boot(){const c=sessionStorage.getItem("ss_cur");if(c&&users()[c])enter(c);else landing()}
boot();
</script></body></html>
